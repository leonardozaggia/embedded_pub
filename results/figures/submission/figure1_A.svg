<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 270" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#000000"/>
    </marker>
    <pattern id="emb" width="8" height="14" patternUnits="userSpaceOnUse">
      <rect width="8" height="14" fill="#ffffff"/>
      <line x1="2" y1="0" x2="2" y2="14" stroke="#4C72B0" stroke-width="1"/>
      <line x1="6" y1="0" x2="6" y2="14" stroke="#000000" stroke-width="0.8"/>
    </pattern>

    <g id="bars5" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">
      <rect x="0" y="0"   width="100" height="22" rx="3" fill="#4C72B0"/><text x="50" y="16">WM</text>
      <rect x="0" y="26"  width="100" height="22" rx="3" fill="#DD8452"/><text x="50" y="42">FS</text>
      <rect x="0" y="52"  width="100" height="22" rx="3" fill="#55A868"/><text x="50" y="68">GDPS</text>
      <rect x="0" y="78"  width="100" height="22" rx="3" fill="#C44E52"/><text x="50" y="94">ATT</text>
      <rect x="0" y="104" width="100" height="22" rx="3" fill="#8172B3"/><text x="50" y="120">HOP</text>
    </g>

    <g id="expert">
      <circle cx="0" cy="-20" r="15" fill="#000000"/>
      <path d="M-26,26 C-26,-8 26,-8 26,26 Z" fill="#000000"/>
      <circle cx="20" cy="15" r="15" fill="#55A868" stroke="#ffffff" stroke-width="2"/>
      <path d="M12,15 l5,5 l11,-12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect y="0" width="1250" height="270" fill="#ffffff"/>
  <g fill="#000000">
    <text x="15" y="45" font-size="44" font-weight="700">A</text>

    <g>
      <rect x="20" y="67" width="80" height="56" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <line x1="35" y1="67" x2="35" y2="123" stroke="#000000" stroke-width="1.5"/>
      <text x="67.5" y="105" font-size="24" font-weight="600" text-anchor="middle">B-4</text>
      <text x="60" y="145" font-size="18" text-anchor="middle">39 items</text>

      <rect x="20" y="177" width="80" height="56" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <line x1="35" y1="177" x2="35" y2="233" stroke="#000000" stroke-width="1.5"/>
      <text x="67.5" y="215" font-size="24" font-weight="600" text-anchor="middle">B-III</text>
      <text x="60" y="255" font-size="18" text-anchor="middle">91 items</text>
    </g>
    <line x1="110" y1="95" x2="196" y2="140" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="110" y1="205" x2="196" y2="160" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="200" y="110" width="180" height="80" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="290" y="148" font-size="34" font-weight="700" text-anchor="middle">LLM</text>
    <text x="290" y="174" font-size="18" text-anchor="middle">Sentence-BERT</text>
    <line x1="380" y1="150" x2="426" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="430" y="100" width="80" height="100" rx="3" fill="url(#emb)" stroke="#000000" stroke-width="1.5"/>
    <text x="470" y="225" font-size="18" text-anchor="middle">768-d space</text>
    <line x1="510" y1="150" x2="556" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>

    <g>
      <text x="610" y="105" font-size="18" text-anchor="middle">cascade pairing</text>
      <g fill="#4C72B0">
        <rect x="555" y="120" width="12" height="12" rx="2"/><rect x="575" y="120" width="12" height="12" rx="2"/>
        <rect x="595" y="120" width="12" height="12" rx="2"/><rect x="615" y="120" width="12" height="12" rx="2"/>
        <rect x="635" y="120" width="12" height="12" rx="2"/>
      </g>
      <g>
        <rect x="555" y="165" width="12" height="12" rx="2" fill="#4C72B0"/><rect x="575" y="165" width="12" height="12" rx="2" fill="#4C72B0"/>
        <rect x="595" y="165" width="12" height="12" rx="2" fill="#4C72B0"/><rect x="615" y="165" width="12" height="12" rx="2" fill="#4C72B0"/>
        <rect x="635" y="165" width="12" height="12" rx="2" fill="#4C72B0"/>
        <rect x="655" y="165" width="12" height="12" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <rect x="675" y="165" width="12" height="12" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      </g>
      <g stroke="#000000" stroke-width="1">
        <line x1="561" y1="132" x2="561" y2="165"/><line x1="581" y1="132" x2="581" y2="165"/>
        <line x1="601" y1="132" x2="601" y2="165"/><line x1="621" y1="132" x2="621" y2="165"/>
        <line x1="641" y1="132" x2="641" y2="165"/>
      </g>
      <text x="610" y="215" font-size="18" text-anchor="middle">+ centroid · expert</text>
    </g>
    <line x1="660" y1="150" x2="706" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>

    <use href="#bars5" x="710" y="87"/>
    <text x="760" y="245" font-size="18" text-anchor="middle">91-item model</text>
    <line x1="810" y1="150" x2="856" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="860" y="110" width="200" height="80" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="960" y="145" font-size="24" font-weight="600" text-anchor="middle">CFA + MIMIC</text>
    <text x="960" y="174" font-size="18" text-anchor="middle">dHCP empirical test</text>
    <line x1="1060" y1="150" x2="1086" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="1090" y="115" width="140" height="30" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="1160" y="136" font-size="18" text-anchor="middle">Determinants</text>
    <rect x="1090" y="155" width="140" height="30" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="1160" y="176" font-size="18" text-anchor="middle">Outcomes</text>
  </g>
</svg>
