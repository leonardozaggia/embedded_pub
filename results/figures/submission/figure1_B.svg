<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 270 1250 270" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#000000"/>
    </marker>
    <pattern id="emb" width="8" height="14" patternUnits="userSpaceOnUse">
      <rect width="8" height="14" fill="#ffffff"/>
      <line x1="2" y1="0" x2="2" y2="14" stroke="#4C72B0" stroke-width="1"/>
      <line x1="6" y1="0" x2="6" y2="14" stroke="#000000" stroke-width="0.8"/>
    </pattern>

    <g id="bars5" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">
      <rect x="0" y="0"   width="100" height="22" rx="3" fill="#4C72B0"/><text x="50" y="16">WM</text>
      <rect x="0" y="26"  width="100" height="22" rx="3" fill="#DD8452"/><text x="50" y="42">FS</text>
      <rect x="0" y="52"  width="100" height="22" rx="3" fill="#55A868"/><text x="50" y="68">GDPS</text>
      <rect x="0" y="78"  width="100" height="22" rx="3" fill="#C44E52"/><text x="50" y="94">ATT</text>
      <rect x="0" y="104" width="100" height="22" rx="3" fill="#8172B3"/><text x="50" y="120">HOP</text>
    </g>

    <g id="expert">
      <circle cx="0" cy="-20" r="15" fill="#000000"/>
      <path d="M-26,26 C-26,-8 26,-8 26,26 Z" fill="#000000"/>
      <circle cx="20" cy="15" r="15" fill="#55A868" stroke="#ffffff" stroke-width="2"/>
      <path d="M12,15 l5,5 l11,-12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect y="270" width="1250" height="270" fill="#ffffff"/>
  <g transform="translate(0, 270)" fill="#000000">
    <text x="15" y="45" font-size="44" font-weight="700">B</text>

    <g>
      <rect x="20" y="102" width="80" height="56" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <line x1="35" y1="102" x2="35" y2="158" stroke="#000000" stroke-width="1.5"/>
      <text x="67.5" y="140" font-size="24" font-weight="600" text-anchor="middle">B-4</text>
      <text x="60" y="182" font-size="18" text-anchor="middle">40 items</text>
    </g>
    <line x1="110" y1="130" x2="256" y2="130" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="260" y="80" width="80" height="100" rx="3" fill="url(#emb)" stroke="#000000" stroke-width="1.5"/>
    <text x="300" y="210" font-size="18" text-anchor="middle">embeddings</text>
    <line x1="340" y1="130" x2="446" y2="130" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>

    <g>
      <g fill="#4C72B0"><circle cx="490" cy="110" r="4.5"/><circle cx="497" cy="104" r="4.5"/><circle cx="484" cy="116" r="4.5"/><circle cx="494" cy="118" r="4.5"/></g>
      <g fill="#DD8452"><circle cx="550" cy="102" r="4.5"/><circle cx="557" cy="108" r="4.5"/><circle cx="546" cy="110" r="4.5"/><circle cx="554" cy="98" r="4.5"/></g>
      <g fill="#55A868"><circle cx="565" cy="146" r="4.5"/><circle cx="572" cy="152" r="4.5"/><circle cx="560" cy="152" r="4.5"/><circle cx="570" cy="140" r="4.5"/></g>
      <g fill="#C44E52"><circle cx="496" cy="152" r="4.5"/><circle cx="503" cy="158" r="4.5"/><circle cx="490" cy="157" r="4.5"/><circle cx="500" cy="146" r="4.5"/></g>
      <g fill="#8172B3"><circle cx="528" cy="128" r="4.5"/><circle cx="535" cy="134" r="4.5"/><circle cx="522" cy="132" r="4.5"/><circle cx="532" cy="122" r="4.5"/></g>
      <text x="510" y="200" font-size="18" text-anchor="middle">consensus K-means · UMAP</text>
    </g>
    <line x1="570" y1="130" x2="676" y2="130" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>

    <use href="#bars5" x="680" y="67"/>
    <text x="730" y="225" font-size="18" text-anchor="middle">5-cluster solution</text>
    <line x1="780" y1="130" x2="886" y2="130" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>

    <g>
      <g>
        <rect x="890" y="70" width="30" height="20" fill="#4C72B0"/><rect x="890" y="94" width="30" height="20" fill="#DD8452"/>
        <rect x="890" y="118" width="30" height="20" fill="#55A868"/><rect x="890" y="142" width="30" height="20" fill="#C44E52"/>
        <rect x="890" y="166" width="30" height="20" fill="#8172B3"/>
      </g>
      <text x="940" y="144" font-size="44" font-weight="600" text-anchor="middle">≈</text>
      <g opacity="0.85">
        <rect x="960" y="70" width="30" height="20" fill="#4C72B0"/><rect x="960" y="94" width="30" height="20" fill="#DD8452"/>
        <rect x="960" y="118" width="30" height="20" fill="#55A868"/><rect x="960" y="142" width="30" height="20" fill="#C44E52"/>
        <rect x="960" y="166" width="30" height="20" fill="#8172B3"/>
      </g>
      <text x="940" y="215" font-size="18" text-anchor="middle">vs. reference</text>
      <text x="940" y="240" font-size="17" text-anchor="middle">ARI · NMI · Sankey</text>
    </g>
    <line x1="990" y1="130" x2="1096" y2="130" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>

    <use href="#expert" x="1150" y="125"/>
    <text x="1150" y="195" font-size="20" text-anchor="middle">expert review</text>
  </g>
</svg>
